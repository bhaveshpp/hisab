<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3F51B5">
  <title>ખાતા · દુકાન હિસાબ</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <script src="store.js"></script>
</head>
<body>
  <div id="hdr" class="hdr"></div>
  <main class="page">
    <div class="total-card"><small>Total balance</small><b id="total">0</b></div>
    <div class="toolbar"><h2>Accounts</h2><button id="add" class="btn btn-sm" type="button">+ Add</button></div>
    <div id="list"></div>
  </main>
  <nav id="nav" class="nav"></nav>

<script>
(() => {
  'use strict';
  const A = App;
  const { $, el, toast } = A;
  if (!A.requireLogin()) return;
  if (!A.guard('accounts')) return;
  const S = A.store;
  let masters = S.masters();
  let showInactive = false;

  function accRow(a) {
    const bal = Number(a.balance) || 0, off = a.status === 'Inactive';
    const attrs = { class: 'row' + (off ? ' inactive' : ''), type: 'button' };
    if (A.canEdit('accounts')) attrs.onclick = () => openForm(a); else attrs.style = 'cursor:default';
    return el('button', attrs,
      el('div', { class: 'ico', text: a.icon }),
      el('div', { class: 'row-main' }, el('div', { class: 'row-title', text: a.name }),
        a.note ? el('div', { class: 'row-sub', text: a.note.split('\n')[0] }) : null),
      el('div', { class: 'row-side' }, el('div', { class: 'row-amt ' + (bal < 0 ? 'amt-expense' : ''), text: '₹ ' + A.money(bal) }), off ? el('span', { class: 'chip', text: 'Inactive' }) : null));
  }
  function render() {
    $('add').hidden = !A.canEdit('accounts');
    const list = $('list'); list.replaceChildren();
    $('total').textContent = '₹ ' + A.money(masters.accounts.reduce((s, a) => s + (Number(a.balance) || 0), 0));
    const active = masters.accounts.filter((a) => a.status !== 'Inactive'), off = masters.accounts.filter((a) => a.status === 'Inactive');
    if (!active.length) list.append(el('div', { class: 'empty', text: 'No active accounts. Tap + Add.' }));
    active.forEach((a) => list.append(accRow(a)));
    if (off.length) {
      list.append(el('button', { class: 'pillbtn', type: 'button', text: (showInactive ? 'Hide' : 'Show') + ' inactive accounts (' + off.length + ')', onclick: () => { showInactive = !showInactive; render(); } }));
      if (showInactive) off.forEach((a) => list.append(accRow(a)));
    }
  }

  function openForm(acc) {
    const name = el('input', { id: 'aName', class: 'field', maxlength: '40', placeholder: 'e.g. Bank KOTAK', autocomplete: 'off' });
    const icon = el('input', { id: 'aIcon', class: 'field', maxlength: '8', placeholder: '🏦' });
    const open = el('input', { id: 'aOpen', class: 'field', type: 'text', inputmode: 'decimal', placeholder: '0' });
    const status = el('select', { id: 'aStatus', class: 'field' }, el('option', { value: 'Active', text: 'Active' }), el('option', { value: 'Inactive', text: 'Inactive (hidden from new entries)' }));
    const note = el('textarea', { id: 'aNote', class: 'field', maxlength: '300', placeholder: 'Account details (bank, A/c no. last digits, IFSC, …)' });
    const save = el('button', { class: 'btn btn-primary', type: 'submit', text: acc ? 'Update' : 'Add account' });
    if (acc) { name.value = acc.name; icon.value = acc.icon; open.value = String(acc.opening_balance); note.value = acc.note; status.value = acc.status === 'Inactive' ? 'Inactive' : 'Active'; }
    const form = el('form', { novalidate: true },
      el('label', { class: 'lbl', for: 'aName', text: 'Name' }), name,
      el('div', { class: 'two' },
        el('div', {}, el('label', { class: 'lbl', for: 'aIcon', text: 'Icon (emoji)' }), icon),
        el('div', {}, el('label', { class: 'lbl', for: 'aOpen', text: 'Opening balance' }), open)),
      el('label', { class: 'lbl', for: 'aStatus', text: 'Status' }), status,
      el('label', { class: 'lbl', for: 'aNote', text: 'Note' }), note, save);
    let close;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!name.value.trim()) { toast('Enter account name.', 'error'); return; }
      const ob = open.value.trim() === '' ? 0 : Number(open.value.replace(/,/g, ''));
      if (!isFinite(ob)) { toast('Opening balance must be a number.', 'error'); return; }
      if (acc && status.value === 'Inactive' && acc.status !== 'Inactive' && Math.abs(Number(acc.balance) || 0) > 0.004 &&
          !confirm('This account still has a balance of ₹' + A.money(acc.balance) + '. Make it inactive anyway? (Its history stays.)')) return;
      A.setBusy(save, true);
      try {
        await S.writeMasters('save_account', { id: acc ? acc.id : '', name: name.value.trim(), icon: icon.value.trim(), opening_balance: ob, status: status.value, note: note.value.trim() });
        masters = S.masters(); close(); toast('Saved'); render();
      } catch (err) { toast(err.message, 'error'); A.setBusy(save, false); }
    });
    close = A.openSheet(acc ? 'Edit account' : 'New account', form);
    name.focus();
  }
  $('add').addEventListener('click', () => openForm(null));

  async function reload(force) {
    try { await S.load(force); masters = S.masters(); render(); }
    catch (err) { if (!S.view()) $('list').replaceChildren(el('div', { class: 'empty', text: err.message })); else if (force) throw err; }
  }
  window.addEventListener('dukan:change', () => { masters = S.masters(); render(); });
  A.mountHeader('🏦 Accounts', async () => { await S.resume(); await reload(true); toast('Refreshed'); });
  A.mountNav('accounts');
  if (S.view()) render(); else $('list').replaceChildren(el('div', { class: 'loading', text: 'Loading…' }));
  S.resume(); reload(false);
})();
</script>
</body>
</html>
