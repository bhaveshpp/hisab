<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3F51B5">
  <title>કેટેગરી · દુકાન હિસાબ</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <script src="store.js"></script>
</head>
<body>
  <div id="hdr" class="hdr"></div>
  <main class="page">
    <div class="seg" id="seg"></div>
    <div class="toolbar"><h2 id="h">Categories</h2><button id="add" class="btn btn-sm" type="button">+ Add</button></div>
    <div id="list"></div>
  </main>
  <nav id="nav" class="nav"></nav>

<script>
(() => {
  'use strict';
  const A = App;
  const { $, el, toast } = A;
  if (!A.requireLogin()) return;
  if (!A.guard('categories')) return;
  const S = A.store;

  const CAT_TYPES = ['Income', 'Expense', 'Investment'];
  let tab = 'Income';
  let masters = S.masters();
  let showInactive = false;

  function catRow(c) {
    const off = c.status === 'Inactive';
    const attrs = { class: 'row' + (off ? ' inactive' : ''), type: 'button' };
    if (A.canEdit('categories')) attrs.onclick = () => openForm(c); else attrs.style = 'cursor:default';
    return el('button', attrs,
      el('div', { class: 'ico', text: c.icon }),
      el('div', { class: 'row-main' }, el('div', { class: 'row-title', text: c.name }),
        c.default_account ? el('div', { class: 'row-sub', text: '→ ' + c.default_account }) : (c.note ? el('div', { class: 'row-sub', text: c.note.split('\n')[0] }) : null)),
      el('div', { class: 'row-side' }, c.budget ? el('small', { text: 'Budget' }) : null, c.budget ? el('div', { class: 'row-amt', text: '₹ ' + A.money(c.budget) }) : null,
        off ? el('span', { class: 'chip', text: 'Inactive' }) : null));
  }
  function render() {
    $('add').hidden = !A.canEdit('categories');
    const seg = $('seg'); seg.replaceChildren(...CAT_TYPES.map((t) =>
      el('button', { type: 'button', class: 't-' + t + (t === tab ? ' active' : ''), text: t, onclick: () => { tab = t; render(); } })));
    $('h').textContent = A.tr(tab + ' categories');
    const list = $('list'); list.replaceChildren();
    const mine = masters.categories.filter((c) => c.type === tab);
    const active = mine.filter((c) => c.status !== 'Inactive'), off = mine.filter((c) => c.status === 'Inactive');
    if (!active.length) list.append(el('div', { class: 'empty', text: 'No active ' + tab.toLowerCase() + ' categories. Tap + Add.' }));
    active.forEach((c) => list.append(catRow(c)));
    if (off.length) {
      list.append(el('button', { class: 'pillbtn', type: 'button', text: (showInactive ? 'Hide' : 'Show') + ' inactive (' + off.length + ')', onclick: () => { showInactive = !showInactive; render(); } }));
      if (showInactive) off.forEach((c) => list.append(catRow(c)));
    }
  }

  function openForm(cat) {
    const type = el('select', { id: 'cType', class: 'field' }, ...CAT_TYPES.map((t) => el('option', { value: t, text: t })));
    const name = el('input', { id: 'cName', class: 'field', maxlength: '40', placeholder: 'e.g. Food', autocomplete: 'off' });
    const icon = el('input', { id: 'cIcon', class: 'field', maxlength: '8', placeholder: '🍔' });
    const defAcc = el('select', { id: 'cDefAcc', class: 'field' }, el('option', { value: '', text: 'None' }), ...masters.accounts.filter((a) => a.status !== 'Inactive').map((a) => el('option', { value: a.name, text: a.icon + ' ' + a.name })));
    const budget = el('input', { id: 'cBudget', class: 'field', type: 'text', inputmode: 'decimal', placeholder: '0' });
    const status = el('select', { id: 'cStatus', class: 'field' }, el('option', { value: 'Active', text: 'Active' }), el('option', { value: 'Inactive', text: 'Inactive (hidden from new entries)' }));
    const note = el('textarea', { id: 'cNote', class: 'field', maxlength: '500', placeholder: 'Details (e.g. SIP folio, fund name, monthly target…)' });
    const save = el('button', { class: 'btn btn-primary', type: 'submit', text: cat ? 'Update' : 'Add category' });
    type.value = cat ? cat.type : tab;
    if (cat) { defAcc.value = cat.default_account || ''; type.disabled = true; name.value = cat.name; icon.value = cat.icon; budget.value = cat.budget ? String(cat.budget) : ''; note.value = cat.note; status.value = cat.status === 'Inactive' ? 'Inactive' : 'Active'; }
    const form = el('form', { novalidate: true },
      el('label', { class: 'lbl', for: 'cType', text: 'Type' }), type,
      el('label', { class: 'lbl', for: 'cName', text: 'Name' }), name,
      el('div', { class: 'two' },
        el('div', {}, el('label', { class: 'lbl', for: 'cIcon', text: 'Icon (emoji)' }), icon),
        el('div', {}, el('label', { class: 'lbl', for: 'cBudget', text: 'Budget (monthly)' }), budget)),
      el('label', { class: 'lbl', for: 'cDefAcc', text: 'Default account' }), defAcc,
      el('label', { class: 'lbl', for: 'cStatus', text: 'Status' }), status,
      el('label', { class: 'lbl', for: 'cNote', text: 'Note' }), note, save);
    let close;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!name.value.trim()) { toast('Enter category name.', 'error'); return; }
      const b = budget.value.trim() === '' ? 0 : Number(budget.value.replace(/,/g, ''));
      if (!isFinite(b) || b < 0) { toast('Budget must be a number.', 'error'); return; }
      A.setBusy(save, true);
      try {
        await S.writeMasters('save_category', { id: cat ? cat.id : '', type: type.value, name: name.value.trim(), icon: icon.value.trim(), budget: b, default_account: defAcc.value, status: status.value, note: note.value.trim() });
        masters = S.masters(); tab = type.value; close(); toast('Saved'); render();
      } catch (err) { toast(err.message, 'error'); A.setBusy(save, false); }
    });
    close = A.openSheet(cat ? 'Edit category' : 'New category', form);
    name.focus();
  }
  $('add').addEventListener('click', () => openForm(null));

  async function reload(force) {
    try { await S.load(force); masters = S.masters(); render(); }
    catch (err) { if (!S.view()) $('list').replaceChildren(el('div', { class: 'empty', text: err.message })); else if (force) throw err; }
  }
  window.addEventListener('dukan:change', () => { masters = S.masters(); render(); });
  A.mountHeader('🏷️ Categories', async () => { await S.resume(); await reload(true); toast('Refreshed'); });
  A.mountNav('categories');
  if (S.view()) render(); else $('list').replaceChildren(el('div', { class: 'loading', text: 'Loading…' }));
  S.resume(); reload(false);
})();
</script>
</body>
</html>
